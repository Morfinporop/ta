<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="LobyStyo - современная видеохостинг платформа для загрузки и просмотра видео">
    <meta name="keywords" content="видео, видеохостинг, стриминг, онлайн видео">
    <title>LobyStyo - Видеохостинг</title>
    
    <!-- Preconnect для Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
    
    <!-- HLS.js для адаптивного стриминга -->
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    
    <!-- CSS файлы -->
    <link rel="stylesheet" href="/css/variables.css">
    <link rel="stylesheet" href="/css/reset.css">
    <link rel="stylesheet" href="/css/animations.css">
    <link rel="stylesheet" href="/css/components.css">
    <link rel="stylesheet" href="/css/layout.css">
    <link rel="stylesheet" href="/css/player.css">
    <link rel="stylesheet" href="/css/pages/home.css">
    <link rel="stylesheet" href="/css/pages/watch.css">
    <link rel="stylesheet" href="/css/pages/upload.css">
    <link rel="stylesheet" href="/css/pages/profile.css">
    <link rel="stylesheet" href="/css/pages/auth.css">
    <link rel="stylesheet" href="/css/pages/search.css">
</head>
<body>
    <!-- Навигация -->
    <nav id="navbar"></nav>
    
    <!-- Основной контейнер -->
    <div id="app-container">
        <aside id="sidebar"></aside>
        <main id="main-content"></main>
    </div>
    
    <!-- Мобильная навигация -->
    <div class="mobile-bottom-nav">
        <div class="mobile-nav-item" onclick="navigate('/')">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
            </svg>
            <span>Главная</span>
        </div>
        <div class="mobile-nav-item" onclick="navigate('/search')">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <circle cx="11" cy="11" r="8"/>
                <path d="m21 21-4.35-4.35"/>
            </svg>
            <span>Поиск</span>
        </div>
        <div class="mobile-nav-item" onclick="navigate('/upload')">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M12 5v14M5 12h14"/>
            </svg>
            <span>Загрузить</span>
        </div>
        <div class="mobile-nav-item" id="mobile-profile-btn">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
                <circle cx="12" cy="7" r="4"/>
            </svg>
            <span>Профиль</span>
        </div>
    </div>
    
    <!-- Контейнер для тостов -->
    <div id="toast-container"></div>
    
    <!-- Контейнер для модальных окон -->
    <div id="modal-container"></div>
    
    <!-- JavaScript файлы -->
    <script src="/js/utils.js"></script>
    <script src="/js/store.js"></script>
    <script src="/js/api.js"></script>
    <script src="/js/websocket.js"></script>
    <script src="/js/components/toast.js"></script>
    <script src="/js/components/modal.js"></script>
    <script src="/js/components/navbar.js"></script>
    <script src="/js/components/sidebar.js"></script>
    <script src="/js/components/videoCard.js"></script>
    <script src="/js/components/commentSection.js"></script>
    <script src="/js/player/controls.js"></script>
    <script src="/js/player/quality.js"></script>
    <script src="/js/player/speed.js"></script>
    <script src="/js/player/fullscreen.js"></script>
    <script src="/js/player/player.js"></script>
    <script src="/js/pages/home.js"></script>
    <script src="/js/pages/watch.js"></script>
    <script src="/js/pages/upload.js"></script>
    <script src="/js/pages/profile.js"></script>
    <script src="/js/pages/login.js"></script>
    <script src="/js/pages/register.js"></script>
    <script src="/js/pages/search.js"></script>
    <script src="/js/router.js"></script>
    <script src="/js/app.js"></script>
</body>
</html>
